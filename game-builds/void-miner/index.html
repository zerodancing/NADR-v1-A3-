<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Шахтёр Пустоты</title><script src="/NADR-v1-A3-/sdk/v1/nadr-sdk.js"></script><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#07070c;color:#fff;font-family:Inter,system-ui}.wrap{height:100%;display:grid;grid-template-columns:280px 1fr;background:radial-gradient(circle at 70% 50%,#2a1c3d,#08080e 60%)}aside{padding:28px;border-right:1px solid #ffffff10;background:#08080db8;display:flex;flex-direction:column}aside small{color:#887a96;text-transform:uppercase;letter-spacing:.16em}#ore{font-size:54px;margin-top:4px}.up{margin-top:auto;display:grid;gap:10px}.up button{padding:13px;text-align:left;border:1px solid #ffffff12;border-radius:11px;background:#16131d;color:#fff;cursor:pointer}.up button:disabled{opacity:.4}.up b,.up span{display:block}.up span{margin-top:4px;color:#b692e7;font-size:11px}.stage{display:grid;place-content:center;justify-items:center;position:relative}.stage h1{position:absolute;top:30px;left:36px;margin:0;font-size:clamp(34px,5vw,70px);line-height:.88;letter-spacing:-.06em}.stage h1 i{color:#b692e7;font-style:normal}.rock{width:min(42vw,420px);aspect-ratio:1;border:0;border-radius:50%;background:radial-gradient(circle at 32% 28%,#86768f,#44384e 42%,#17131d 76%);box-shadow:inset -42px -52px 80px #0a080e,0 0 100px #b692e722;cursor:pointer;transition:.06s}.rock:active{transform:scale(.965)}#power{color:#95889f}@media(max-width:760px){.wrap{grid-template-columns:1fr}aside{position:fixed;z-index:2;inset:10px 10px auto;padding:12px;border:1px solid #ffffff12;border-radius:12px}.up{display:none}#ore{font-size:26px}.stage h1{top:90px}}</style></head><body><div class="wrap"><aside><small>Добыто материи</small><strong id="ore">0</strong><div class="up"><button id="laser"><b>Усилить лазер</b><span id="laserCost">25</span></button><button id="drone"><b>Дрон-добытчик</b><span id="droneCost">80</span></button></div></aside><div class="stage"><h1>ШАХТЁР<br><i>ПУСТОТЫ</i></h1><button class="rock" id="rock" aria-label="Добывать материю"></button><p id="power">Лазер 1 · дроны 0</p></div></div><script>(()=>{const oreEl=document.querySelector('#ore'),powerEl=document.querySelector('#power'),laser=document.querySelector('#laser'),drone=document.querySelector('#drone'),lc=document.querySelector('#laserCost'),dc=document.querySelector('#droneCost');let ore=0,power=1,drones=0,laserCost=25,droneCost=80,paused=false,timer=0;function render(){oreEl.textContent=Math.floor(ore);powerEl.textContent=`Лазер ${power} · дроны ${drones}`;lc.textContent=`${laserCost} материи`;dc.textContent=`${droneCost} материи`;laser.disabled=ore<laserCost;drone.disabled=ore<droneCost}function save(){clearTimeout(timer);timer=setTimeout(()=>NADR.storage.set('progress',{ore,power,drones,laserCost,droneCost}).catch(()=>{}),180)}function reset(){ore=0;power=1;drones=0;laserCost=25;droneCost=80;render();save()}document.querySelector('#rock').onclick=()=>{if(paused)return;ore+=power;render();save()};laser.onclick=()=>{if(ore<laserCost)return;ore-=laserCost;power++;laserCost=Math.ceil(laserCost*1.7);render();save()};drone.onclick=()=>{if(ore<droneCost)return;ore-=droneCost;drones++;droneCost=Math.ceil(droneCost*1.85);render();save()};setInterval(()=>{if(!paused&&drones){ore+=drones;render();save()}},1000);NADR.on('restart',reset);NADR.on('pause',()=>paused=true);NADR.on('resume',()=>paused=false);NADR.on('init',async()=>{const s=await NADR.storage.get('progress').catch(()=>null);if(s){ore=Math.max(0,+s.ore||0);power=Math.max(1,+s.power||1);drones=Math.max(0,+s.drones||0);laserCost=Math.max(25,+s.laserCost||25);droneCost=Math.max(80,+s.droneCost||80)}render();NADR.ready()});render()})();</script></body></html>
