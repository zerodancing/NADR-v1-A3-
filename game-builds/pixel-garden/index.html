<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Пиксельный сад</title><script src="/NADR-v1-A3-/sdk/v1/nadr-sdk.js"></script><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#0a100c;color:#ecf7ef;font-family:Inter,system-ui}.wrap{height:100%;display:grid;grid-template-rows:auto 1fr auto;padding:24px;background:radial-gradient(circle at 50% 45%,#1b3021,#08100b 70%)}header{display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:24px;letter-spacing:.08em}header span{font-size:11px;color:#91a99a}.garden{width:min(65vh,620px);height:min(65vh,620px);margin:auto;display:grid;grid-template-columns:repeat(8,1fr);gap:7px}.plot{position:relative;border:1px solid #ffffff10;border-radius:10px;background:#152019;cursor:pointer;overflow:hidden}.plot:before,.plot:after{content:'';position:absolute;left:50%;bottom:18%;transform:translateX(-50%);transition:.18s}.plot[data-s='1']:before{width:8px;height:18px;border-radius:8px;background:#72c78a}.plot[data-s='2']:before{width:10px;height:34px;border-radius:8px;background:#67bb7e}.plot[data-s='2']:after{width:28px;height:15px;border-radius:50%;background:#69d28a}.plot[data-s='3']:before,.plot[data-s='4']:before{width:12px;height:44px;border-radius:8px;background:#66b97a}.plot[data-s='3']:after,.plot[data-s='4']:after{bottom:45%;width:34px;height:34px;border-radius:50%;background:#cfe27c;box-shadow:-18px 8px 0 #8edb83,18px 8px 0 #79c8a0}.plot[data-s='4']:after{background:#f0b4ce;box-shadow:-18px 8px 0 #ffd477,18px 8px 0 #a8d8ff,0 -16px 0 #fff0b2}footer{display:flex;justify-content:space-between;align-items:center;color:#829488;font-size:12px}button.reset{padding:9px 13px;border:1px solid #ffffff15;border-radius:10px;background:#16221a;color:#eaf5ed;cursor:pointer}</style></head><body><div class="wrap"><header><span>NADR · A3</span><h1>ПИКСЕЛЬНЫЙ САД</h1><span id="bloom">0%</span></header><div class="garden" id="garden"></div><footer><span id="hint">Выращивайте клетки в своём темпе.</span><button class="reset" id="reset">Новый сад</button></footer></div><script>(()=>{const garden=document.querySelector('#garden'),bloom=document.querySelector('#bloom'),hint=document.querySelector('#hint');let plots=[],paused=false,timer=0;for(let i=0;i<64;i++){const b=document.createElement('button');b.className='plot';b.dataset.s='0';b.onclick=()=>grow(i);garden.append(b);plots.push(b)}function state(){return plots.map(p=>+p.dataset.s)}function render(){const total=state().reduce((a,b)=>a+b,0),pct=Math.round(total/256*100);bloom.textContent=`${pct}%`;hint.textContent=pct===100?'Сад полностью расцвёл.':pct>65?'Почти готово — помогите отстающим росткам.':pct>25?'Соседние растения иногда растут вместе.':'Выращивайте клетки в своём темпе.'}function save(){clearTimeout(timer);timer=setTimeout(()=>NADR.storage.set('garden',state()).catch(()=>{}),180)}function grow(i){if(paused)return;const p=plots[i];p.dataset.s=Math.min(4,+p.dataset.s+1);for(const n of [i-8,i+8,i%8?i-1:-1,i%8<7?i+1:-1])if(n>=0&&n<64&&Math.random()<.28)plots[n].dataset.s=Math.min(4,+plots[n].dataset.s+1);render();save()}function reset(){for(const p of plots)p.dataset.s='0';render();save()}document.querySelector('#reset').onclick=reset;NADR.on('restart',reset);NADR.on('pause',()=>paused=true);NADR.on('resume',()=>paused=false);NADR.on('init',async()=>{const saved=await NADR.storage.get('garden').catch(()=>null);if(Array.isArray(saved)&&saved.length===64)saved.forEach((v,i)=>plots[i].dataset.s=String(Math.max(0,Math.min(4,+v||0))));render();NADR.ready()});render()})();</script></body></html>
