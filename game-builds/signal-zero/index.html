<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Сигнал: Ноль</title><script src="/NADR-v1-A3-/sdk/v1/nadr-sdk.js"></script><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:radial-gradient(circle at 50% 35%,#18283e,#070910 70%);color:#fff;font-family:Inter,system-ui;overflow:hidden}.wrap{height:100%;display:grid;grid-template-rows:auto 1fr;padding:22px}.hud{display:flex;justify-content:center;gap:10px}.hud div{min-width:120px;padding:8px 14px;border:1px solid #ffffff18;border-radius:12px;background:#090c13aa;text-align:center}.hud span{display:block;font-size:9px;letter-spacing:.16em;color:#78879a}.hud b{font-size:20px}.grid{width:min(68vh,620px);height:min(68vh,620px);margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.cell{border:1px solid #ffffff12;border-radius:18px;background:linear-gradient(145deg,#121824,#0a0d14);cursor:pointer;transition:.12s}.cell.active{background:#17463f;border-color:#7ce6c4;box-shadow:0 0 40px #7ce6c444}.cell.bad{background:#451923;border-color:#ef4f6b}.overlay{position:fixed;inset:0;display:grid;place-items:center;background:#05070be8;backdrop-filter:blur(8px);text-align:center}.overlay.hidden{display:none}.overlay h1{font-size:clamp(42px,7vw,80px);margin:0;letter-spacing:-.06em}.overlay p{color:#95a2b5}.overlay button{border:0;border-radius:13px;padding:13px 22px;background:#7ce6c4;color:#06100e;font-weight:900;cursor:pointer}</style></head><body><div class="wrap"><div class="hud"><div><span>СЧЁТ</span><b id="score">0</b></div><div><span>СЕРИЯ</span><b id="combo">×1</b></div><div><span>ВРЕМЯ</span><b id="time">45.0</b></div></div><div class="grid" id="grid"></div></div><div class="overlay" id="overlay"><div><h1>СИГНАЛ: НОЛЬ</h1><p>Запоминайте вспышки и повторяйте последовательность.</p><button id="start">Начать</button></div></div><script>(()=>{const grid=document.querySelector('#grid'),overlay=document.querySelector('#overlay'),scoreEl=document.querySelector('#score'),comboEl=document.querySelector('#combo'),timeEl=document.querySelector('#time');let cells=[],seq=[],input=0,score=0,combo=1,left=45,running=false,showing=false,last=0,paused=false;for(let i=0;i<9;i++){const b=document.createElement('button');b.className='cell';b.onclick=()=>press(i);grid.append(b);cells.push(b)}const sleep=ms=>new Promise(r=>setTimeout(r,ms));async function flash(){showing=true;for(const i of seq){cells[i].classList.add('active');await sleep(330);cells[i].classList.remove('active');await sleep(120)}input=0;showing=false}async function next(){seq.push(Math.floor(Math.random()*9));await sleep(350);flash()}function press(i){if(!running||showing)return;if(i===seq[input]){cells[i].classList.add('active');setTimeout(()=>cells[i].classList.remove('active'),120);input++;score+=10*combo;if(input===seq.length){combo++;score+=seq.length*5;next()}}else{cells[i].classList.add('bad');setTimeout(()=>cells[i].classList.remove('bad'),220);combo=1;input=0;flash()}render()}function render(){scoreEl.textContent=score;comboEl.textContent=`×${combo}`;timeEl.textContent=left.toFixed(1)}function reset(){seq=[];input=0;score=0;combo=1;left=45;running=true;overlay.classList.add('hidden');last=performance.now();render();next()}function end(){running=false;overlay.classList.remove('hidden');overlay.querySelector('h1').textContent=`${score} очков`;overlay.querySelector('p').textContent='Попробуйте удержать серию дольше.';document.querySelector('#start').textContent='Ещё раз';NADR.score(score)}function loop(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;if(running&&!paused){left-=dt;if(left<=0){left=0;end()}render()}requestAnimationFrame(loop)}document.querySelector('#start').onclick=reset;addEventListener('keydown',e=>{const n=Number(e.key);if(n>=1&&n<=9)press(n-1)});NADR.on('restart',reset);NADR.on('pause',()=>paused=true);NADR.on('resume',()=>{paused=false;last=performance.now()});NADR.on('init',()=>NADR.ready());requestAnimationFrame(loop)})();</script></body></html>
