<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neon Highway</title><script src="/NADR-v1-A3-/sdk/v1/nadr-sdk.js"></script><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#03040a;color:#fff;font-family:Inter,system-ui,sans-serif}canvas{width:100%;height:100%;display:block}.hud{position:fixed;inset:16px 18px auto;display:flex;justify-content:space-between;pointer-events:none;text-shadow:0 2px 12px #000}.hud b{font-size:22px}.hint{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);padding:8px 12px;border:1px solid #ffffff22;border-radius:12px;background:#050712bb;font-size:12px;color:#c8ccda}.over{position:fixed;inset:0;display:none;place-items:center;background:#02030bd9}.over div{text-align:center}.over h1{font-size:38px;margin:0 0 8px}.over button{border:0;border-radius:14px;padding:12px 20px;background:#ef4f6b;color:white;font-weight:800;cursor:pointer}</style></head><body><canvas id="c"></canvas><div class="hud"><span>NADR · A3<br><b id="score">0</b></span><span>NEON HIGHWAY<br><b id="speed">120</b> км/ч</span></div><div class="hint">← → / A D — полоса · ↑ ↓ — скорость</div><div class="over" id="over"><div><h1>Сбой маршрута</h1><p id="final"></p><button id="again">Ещё заезд</button></div></div><script>(()=>{const c=document.querySelector('#c'),x=c.getContext('2d'),scoreEl=document.querySelector('#score'),speedEl=document.querySelector('#speed'),over=document.querySelector('#over');let w,h,lane=1,target=1,speed=120,score=0,last=0,spawn=0,dead=false,cars=[];function resize(){w=c.width=innerWidth*devicePixelRatio;h=c.height=innerHeight*devicePixelRatio}addEventListener('resize',resize);resize();function reset(){lane=target=1;speed=120;score=0;spawn=0;dead=false;cars=[];over.style.display='none';last=performance.now();requestAnimationFrame(loop)}function roadY(y){return h*.25+y*h*.75}function laneX(i,y){const p=.18+y*.42;return w/2+(i-1)*w*p*.42}function spawnCar(){cars.push({lane:Math.floor(Math.random()*3),y:-.06,v:.17+Math.random()*.08})}function loop(t){if(dead)return;const dt=Math.min(.035,(t-last)/1000);last=t;score+=dt*speed/8;spawn-=dt;if(spawn<=0){spawnCar();spawn=.55+Math.random()*.45-speed/500}target+=(lane-target)*Math.min(1,dt*9);for(const a of cars)a.y+=dt*a.v*(speed/100);cars=cars.filter(a=>a.y<1.2);for(const a of cars)if(a.lane===lane&&a.y>.78&&a.y<.96){dead=true;over.style.display='grid';document.querySelector('#final').textContent=`Дистанция: ${Math.floor(score)} · скорость: ${speed} км/ч`;NADR?.score?.(Math.floor(score));return}draw(t);scoreEl.textContent=Math.floor(score);speedEl.textContent=speed;requestAnimationFrame(loop)}function draw(t){x.fillStyle='#03040a';x.fillRect(0,0,w,h);const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#120827');g.addColorStop(.5,'#071226');g.addColorStop(1,'#020309');x.fillStyle=g;x.fillRect(0,0,w,h);for(let i=0;i<24;i++){const xx=(i*137+t*.03)%w;x.fillStyle=i%2?'#7ce6c422':'#ef4f6b22';x.fillRect(xx,h*.08+(i%5)*h*.025,2+(i%3),h*.14)}x.beginPath();x.moveTo(w*.43,h*.24);x.lineTo(w*.12,h);x.lineTo(w*.88,h);x.lineTo(w*.57,h*.24);x.closePath();x.fillStyle='#0a0c13';x.fill();for(let i=1;i<3;i++){x.strokeStyle='#ffffff22';x.lineWidth=2*devicePixelRatio;x.beginPath();x.moveTo(laneX(i,.01),roadY(.01));x.lineTo(laneX(i,1),roadY(1));x.stroke()}for(let j=0;j<15;j++){const y=((j/15+t*.00028*(speed/120))%1);x.fillStyle='#7ce6c4aa';for(let i=0;i<3;i++)x.fillRect(laneX(i,y)-2*devicePixelRatio,roadY(y),4*devicePixelRatio,12*devicePixelRatio*(.4+y))}for(const a of cars){const px=laneX(a.lane,a.y),py=roadY(a.y),s=(.3+a.y)*28*devicePixelRatio;x.fillStyle='#ef4f6b';x.fillRect(px-s*.55,py-s*.3,s*1.1,s*.6);x.fillStyle='#fff';x.fillRect(px-s*.38,py-s*.24,s*.2,s*.08)}const py=h*.86,px=laneX(target,.86),s=45*devicePixelRatio;x.save();x.translate(px,py);x.fillStyle='#7ce6c4';x.beginPath();x.moveTo(0,-s*.65);x.lineTo(s*.55,s*.55);x.lineTo(0,s*.3);x.lineTo(-s*.55,s*.55);x.closePath();x.fill();x.restore()}addEventListener('keydown',e=>{if(dead&&e.key==='Enter')reset();if(['ArrowLeft','a','A'].includes(e.key))lane=Math.max(0,lane-1);if(['ArrowRight','d','D'].includes(e.key))lane=Math.min(2,lane+1);if(e.key==='ArrowUp')speed=Math.min(220,speed+10);if(e.key==='ArrowDown')speed=Math.max(80,speed-10)});document.querySelector('#again').onclick=reset;NADR?.on?.('restart',reset);NADR?.on?.('init',()=>NADR.ready());reset()})();</script></body></html>
