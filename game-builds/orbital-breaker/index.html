<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Орбитальный разлом</title><script src="/NADR-v1-A3-/sdk/v1/nadr-sdk.js"></script><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#031012;color:#eafffb;font-family:Inter,system-ui}canvas{width:100%;height:100%;display:block}.hud{position:fixed;inset:18px 24px auto;display:flex;justify-content:space-between;pointer-events:none}.hud span{display:block;font-size:10px;letter-spacing:.16em;color:#7fa4a1}.hud b{font-size:25px}.hint{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);padding:8px 12px;border:1px solid #ffffff20;border-radius:12px;background:#061112cc;font-size:12px}</style></head><body><canvas id="c"></canvas><div class="hud"><div><span>ЯДРО</span><b id="hp">100</b></div><div style="text-align:right"><span>СЧЁТ</span><b id="score">0</b></div></div><div class="hint">A / D или ← → — вращать щит · Space — импульс</div><script>(()=>{const c=document.querySelector('#c'),x=c.getContext('2d'),hpEl=document.querySelector('#hp'),scoreEl=document.querySelector('#score');let w,h,angle=0,hp=100,score=0,rocks=[],last=0,spawn=0,pulse=0,paused=false,keys=new Set;function resize(){w=c.width=innerWidth*devicePixelRatio;h=c.height=innerHeight*devicePixelRatio}resize();addEventListener('resize',resize);function reset(){hp=100;score=0;rocks=[];spawn=.3;angle=0;last=performance.now()}function add(){rocks.push({a:Math.random()*Math.PI*2,d:Math.max(w,h)*.45,s:55+Math.random()*45,r:8+Math.random()*10})}function loop(t){const dt=Math.min(.04,(t-last)/1000||0);last=t;if(!paused){if(keys.has('a')||keys.has('arrowleft'))angle-=2.4*dt;if(keys.has('d')||keys.has('arrowright'))angle+=2.4*dt;pulse=Math.max(0,pulse-dt);spawn-=dt;if(spawn<0){add();spawn=Math.max(.22,.75-score/3500)}const sr=Math.min(w,h)*.2;for(const r of rocks){r.d-=r.s*dt;const diff=Math.atan2(Math.sin(r.a-angle),Math.cos(r.a-angle));if(r.d<sr+18&&r.d>sr-18&&Math.abs(diff)<.55){r.d=-1;score+=pulse?30:15}else if(r.d<25){r.d=-1;hp=Math.max(0,hp-12)}}rocks=rocks.filter(r=>r.d>0);if(!hp)reset()}draw();hpEl.textContent=hp;scoreEl.textContent=score;requestAnimationFrame(loop)}function draw(){x.fillStyle='#031012';x.fillRect(0,0,w,h);x.save();x.translate(w/2,h/2);for(let r=70;r<Math.max(w,h);r+=65){x.strokeStyle='#7ce6c415';x.beginPath();x.arc(0,0,r,0,Math.PI*2);x.stroke()}const g=x.createRadialGradient(0,0,0,0,0,55);g.addColorStop(0,'white');g.addColorStop(.25,'#7ce6c4');g.addColorStop(1,'transparent');x.fillStyle=g;x.beginPath();x.arc(0,0,55,0,Math.PI*2);x.fill();x.save();x.rotate(angle);x.strokeStyle=pulse?'white':'#7ce6c4';x.lineWidth=pulse?14:9;x.shadowColor='#7ce6c4';x.shadowBlur=25;x.beginPath();x.arc(0,0,Math.min(w,h)*.2,-.55,.55);x.stroke();x.restore();for(const r of rocks){x.save();x.rotate(r.a);x.translate(r.d,0);x.fillStyle='#c0aaa7';x.beginPath();x.arc(0,0,r.r,0,Math.PI*2);x.fill();x.restore()}x.restore()}addEventListener('keydown',e=>{keys.add(e.key.toLowerCase());if(e.code==='Space'){e.preventDefault();pulse=.2;for(const r of rocks)if(r.d<Math.min(w,h)*.28){r.d=-1;score+=8}}});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));NADR.on('restart',reset);NADR.on('pause',()=>paused=true);NADR.on('resume',()=>{paused=false;last=performance.now()});NADR.on('init',()=>NADR.ready());reset();requestAnimationFrame(loop)})();</script></body></html>
